<!doctype html>
<html lang="vi"><head><meta charset="UTF-8" /><meta name="viewport" content="width=1080, height=1920" />
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Be+Vietnam+Pro:wght@500;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000;font-family:"Be Vietnam Pro",sans-serif;color:#fff}
#root{position:relative;width:1080px;height:1920px}
video{filter:saturate(1.05) contrast(1.03)}
.scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,.05) 34%,rgba(0,0,0,.20) 60%,rgba(0,0,0,.82) 100%)}
.wrap{position:absolute;left:90px;right:90px;bottom:340px}
.kick{display:inline-block;font-weight:800;font-size:28px;letter-spacing:.20em;text-transform:uppercase;color:#0b0b0b;background:#FFC53D;padding:9px 20px;border-radius:8px;margin-bottom:26px}
.head{font-family:"Anton",sans-serif;line-height:1.04;letter-spacing:.005em;text-transform:uppercase;text-shadow:0 6px 34px rgba(0,0,0,.6)}
.head .line{display:block}
.head .em{color:#FFC53D}
.sub{margin-top:30px;font-size:40px;line-height:1.42;font-weight:600;color:#F2F4F8;max-width:900px;text-shadow:0 3px 18px rgba(0,0,0,.7)}
.sub b{color:#FFD873}
.brand{position:absolute;left:90px;bottom:150px;font-family:"Anton",sans-serif;font-size:40px;letter-spacing:.06em;color:#fff;opacity:.92;text-shadow:0 3px 16px rgba(0,0,0,.7)}
.pbar{position:absolute;left:0;bottom:0;height:10px;width:1080px;background:rgba(255,255,255,.14)}
.pfill{position:absolute;left:0;bottom:0;height:10px;width:1080px;background:#FFC53D;transform-origin:left center}
.scene{position:absolute;inset:0}
</style></head><body>

<div id="root" data-composition-id="main" data-start="0" data-duration="10.5" data-width="1080" data-height="1920">
<video id="bg1" src="media/s1.mp4" data-start="0.0" data-duration="3.5" data-media-start="0" data-track-index="0" muted playsinline style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"></video>
<video id="bg2" src="media/s2.mp4" data-start="3.5" data-duration="3.5" data-media-start="0" data-track-index="1" muted playsinline style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"></video>
<video id="bg3" src="media/s3.mp4" data-start="7.0" data-duration="3.5" data-media-start="0" data-track-index="2" muted playsinline style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"></video>
<div class="layer scrim clip" data-start="0" data-duration="10.5" data-track-index="3"></div>
<div class="scene clip" id="scene1" data-start="0.0" data-duration="3.5" data-track-index="4"><div class="wrap"><div class="kick anim">Sức khoẻ</div><div class="head anim" style="font-size:96px"><span class="line">Đi bộ 20 phút</span><span class="line"><span class="em">mỗi sáng</span></span></div><div class="sub anim">Thói quen nhỏ, thay đổi lớn.</div></div></div>
<div class="scene clip" id="scene2" data-start="3.5" data-duration="3.5" data-track-index="5"><div class="wrap"><div class="kick anim">Dinh dưỡng</div><div class="head anim" style="font-size:118px"><span class="line">Ăn <span class="em">thật</span></span><span class="line">ăn đủ</span></div><div class="sub anim">Cơ thể cảm ơn bạn mỗi ngày.</div></div></div>
<div class="scene clip" id="scene3" data-start="7.0" data-duration="3.5" data-track-index="6"><div class="wrap"><div class="kick anim">Thể dục</div><div class="head anim" style="font-size:118px"><span class="line">10 phút</span><span class="line"><span class="em">là đủ</span></span></div><div class="sub anim">Đều đặn thắng cường độ.</div></div></div>
<div class="layer clip" data-start="0" data-duration="10.5" data-track-index="7"><div class="brand">ANTOA</div><div class="pbar"></div><div class="pfill" id="pfill"></div></div>
<audio id="bgm" src="audio/bgm.mp3" data-start="0" data-duration="10.5" data-track-index="8" data-volume="0.06"></audio>
</div>
<script>window.__timelines=window.__timelines||{};var tl=gsap.timeline({paused:true});
gsap.set("#pfill",{scaleX:0});tl.to("#pfill",{scaleX:1,duration:10.5,ease:"none"},0);
function enter(s,a){tl.from(s+" .anim",{opacity:0,y:48,duration:0.62,ease:"power3.out",stagger:0.13},a);}
enter("#scene1",0.12);
enter("#scene2",3.62);
enter("#scene3",7.12);
window.__timelines["main"]=tl;</script></body></html>
