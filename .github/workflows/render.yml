name: ANTOA Render

# 2 cách kích hoạt:
#  1) repository_dispatch (event "render") — Tower gọi tự động, kèm client_payload (spec + callback).
#  2) workflow_dispatch — Boss bấm tay trên GitHub để TEST (nhập tiêu đề, tự soạn cảnh bằng Claude).
# Chưa có R2/Cloudflare vẫn chạy: MP4 xuất ra ARTIFACT tải về xem. Có R2 thì up thêm + callback.
on:
  repository_dispatch:
    types: [render]
  workflow_dispatch:
    inputs:
      title:
        description: "Tiêu đề tin (test)"
        required: true
        default: "OpenAI ra Agent Builder — tự dựng AI Agent chỉ bằng kéo thả"
      article:
        description: "Nội dung gốc (dán vài đoạn, để trống cũng được)"
        required: false
        default: ""
      template:
        description: "Mẫu video"
        required: true
        default: "newsroom"
      voice:
        description: 'Giọng: "vbee:<code>" hoặc "edge:<code>"'
        required: true
        default: "vbee:hn_male_manhdung_news_48k-fhg"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Cache để lần sau KHÔNG tải lại (ephemeral runner làm mới máy mỗi lần).
      - name: Cache npm + pip + Chrome (puppeteer)
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/pip
            ~/.cache/puppeteer
            ~/.cache/ms-playwright
            ~/.cache/huggingface
            node_modules
          key: antoa-deps-${{ runner.os }}-node22-hf0764-pw-vieneu
          restore-keys: antoa-deps-${{ runner.os }}-

      - name: Cài ffmpeg + font + edge-tts + VieNeu + thư viện Chromium
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core libsndfile1
          pip install edge-tts vieneu   # VieNeu = giọng Việt offline (ONNX, free); model ~600MB tự tải lần đầu → cache ~/.cache/huggingface
          # Thư viện hệ thống cho Chromium (HyperFrames dùng Chrome puppeteer; chụp ảnh dùng Chromium Playwright).
          npx --yes playwright@latest install-deps chromium || true
          # Cài Playwright (package.json) + tải Chromium (cache lại) — để chup.mjs chụp ảnh bài gốc.
          npm install --no-audit --no-fund --silent || true
          npx playwright install chromium || true

      # CHỤP ẢNH BÀI GỐC (Playwright) → shots/img/*.png cho cảnh .card (độ tin cậy). Fail-safe: lỗi → soạn text-only.
      - name: Chụp ảnh bài gốc (2-3 ảnh, ảnh đầu làm thumbnail)
        if: ${{ github.event.client_payload.meta.url != '' }}
        continue-on-error: true
        env:
          IMG_MODE: ${{ github.event.client_payload.meta.imgMode }}   # 'article' = Tin tức VN: tải ẢNH BÀI BÁO (og:image) thay chụp chữ
          IMG_QUERY: ${{ github.event.client_payload.meta.brandkw }}   # từ khoá phụ để tìm ẢNH MINH HOẠ khi bài thiếu ảnh
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}                # bù ẢNH MINH HOẠ (đủ 3-4 ảnh dù bài ít ảnh)
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: node chup.mjs "${{ github.event.client_payload.meta.url }}" shots 2

      # AI SOẠN CẢNH CHẠY Ở ĐÂY (runner Mỹ) — vì Anthropic trả 403 "Request not allowed" cho request
      # phát từ Cloudflare Workers. Tower auto KHÔNG gửi spec (spec:null) → bước này gọi Claude soạn.
      # Cũng chạy khi test tay (workflow_dispatch). Có spec sẵn (hiếm) thì bỏ qua.
      - name: Soạn cảnh bằng Claude (Tower auto khi không gửi spec, hoặc test tay)
        if: ${{ github.event_name == 'workflow_dispatch' || !github.event.client_payload.spec }}
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          CLAUDE_MODEL: ${{ secrets.CLAUDE_MODEL }}
          TITLE: ${{ github.event.client_payload.title || github.event.inputs.title }}
          ARTICLE: ${{ github.event.client_payload.script || github.event.inputs.article }}
          TEMPLATE: ${{ github.event.client_payload.template || github.event.inputs.template }}
          BRANDKW: ${{ github.event.client_payload.meta.brandkw || 'AI Agent, tự động hoá kinh doanh, AI thực chiến' }}
          BRAND_LABEL: ${{ github.event.client_payload.meta.brandLabel }}
          SLOGAN: ${{ github.event.client_payload.meta.slogan }}
          SOURCE: ${{ github.event.client_payload.meta.source }}
          SPEC_VOICE: ${{ github.event.client_payload.voice || github.event.inputs.voice }}
          IMG_MODE: ${{ github.event.client_payload.meta.imgMode }}     # 'article' = Tin tức VN → video dài ~85s (10-12 cảnh)
          VERBATIM: ${{ github.event.client_payload.meta.verbatim }}    # '1' = dùng ĐÚNG NGUYÊN VĂN kịch bản Boss sửa (không viết lại lời)
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}                 # Mẫu Slide Tạp Chí: ảnh free theo từ khoá (link động, không lưu)
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          OWN_IMAGES: ${{ toJSON(github.event.client_payload.meta.ownImages) }}   # ảnh riêng Drive (Phase 2) — Tower gửi list URL
        run: |
          if [ -z "$CLAUDE_API_KEY" ]; then echo "❌ Thiếu CLAUDE_API_KEY secret trên render-backend — không soạn được"; exit 1; fi
          case "$TEMPLATE" in
            slides)   node soan_slides.mjs ;;
            newsroom) node soan_canh.mjs ;;
            phunu)    node soan_phunu.mjs ;;
            broll)    node soan_broll.mjs ;;
            *)        echo "❌ Mẫu '$TEMPLATE' chưa hỗ trợ soạn-cảnh"; exit 1 ;;
          esac

      - name: Render MP4 (chạy đúng gói mẫu)
        env:
          TEMPLATE: ${{ github.event.client_payload.template || github.event.inputs.template }}
          SPEC: ${{ toJSON(github.event.client_payload.spec) }}
          TITLE: ${{ github.event.client_payload.title || github.event.inputs.title }}
          SCRIPT: ${{ github.event.client_payload.script || github.event.inputs.article }}
          VOICE: ${{ github.event.client_payload.voice || github.event.inputs.voice }}
          BRAND_LABEL: ${{ github.event.client_payload.meta.brandLabel }}
          SLOGAN: ${{ github.event.client_payload.meta.slogan }}
          VBEE_APP_ID: ${{ secrets.VBEE_APP_ID }}
          VBEE_TOKEN: ${{ secrets.VBEE_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: node render.mjs

      - name: Xuất MP4 ra artifact (luôn — tải về xem)
        uses: actions/upload-artifact@v4
        with:
          name: antoa-video
          path: |
            out.mp4
            duration.txt
          if-no-files-found: error
          retention-days: 14

      - name: Up R2 (chỉ khi đã có secret R2 — để mai)
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto                      # R2 CẦN region='auto' — thiếu là aws-cli exit 1
          AWS_EC2_METADATA_DISABLED: "true"             # né lookup metadata thừa
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required   # aws-cli v2 mới thêm checksum → R2 lệch chữ ký (SignatureDoesNotMatch)
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          CONTENT_ID: ${{ github.event.client_payload.contentId }}
        if: ${{ env.R2_BUCKET != '' }}
        run: |
          KEY="renders/${CONTENT_ID:-test-$GITHUB_RUN_ID}.mp4"
          aws s3 cp out.mp4 "s3://$R2_BUCKET/$KEY" \
            --endpoint-url "${{ secrets.R2_ENDPOINT }}" --region auto --content-type video/mp4
          echo "R2_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Callback về Tower (chỉ khi Tower gọi — có callback URL)
        if: ${{ github.event.client_payload.callback != '' }}
        run: |
          DUR=$(cat duration.txt 2>/dev/null || echo 0); case "$DUR" in ''|*[!0-9.]*) DUR=0;; esac
          URL="${{ secrets.R2_PUBLIC_URL }}/$R2_KEY"
          CAP=$(cat caption.txt 2>/dev/null || echo "")
          SCRIPT=$(cat script.txt 2>/dev/null || echo "")
          IMAGES=$(cat images.json 2>/dev/null || echo '[]'); [ -z "$IMAGES" ] && IMAGES='[]'
          # jq dựng JSON an toàn (caption/script có xuống dòng/dấu ngoặc) — gửi caption + KỊCH BẢN THẬT + link video + LINK ẢNH đã dùng.
          jq -n --arg jobId "${{ github.event.client_payload.jobId }}" \
                --arg contentId "${{ github.event.client_payload.contentId }}" \
                --arg outputUrl "$URL" \
                --argjson durationSec "$DUR" \
                --arg caption "$CAP" \
                --arg script "$SCRIPT" \
                --argjson images "$IMAGES" \
                --arg secret "${{ secrets.RENDER_CALLBACK_SECRET }}" \
                '{jobId:$jobId,contentId:$contentId,status:"done",outputUrl:$outputUrl,durationSec:$durationSec,caption:$caption,script:$script,images:$images,secret:$secret}' \
          | curl -sS -X POST "${{ github.event.client_payload.callback }}" -H 'content-type: application/json' -d @-

      - name: Callback lỗi (nếu Tower gọi)
        if: ${{ failure() && github.event.client_payload.callback != '' }}
        run: |
          curl -sS -X POST "${{ github.event.client_payload.callback }}" \
            -H 'content-type: application/json' \
            -d "{\"jobId\":\"${{ github.event.client_payload.jobId }}\",\"contentId\":\"${{ github.event.client_payload.contentId }}\",\"status\":\"failed\",\"error\":\"render workflow lỗi\",\"secret\":\"${{ secrets.RENDER_CALLBACK_SECRET }}\"}" || true
