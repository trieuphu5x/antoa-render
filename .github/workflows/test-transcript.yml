name: TEST Transcript (poToken)

# Kiểm chứng: yt-dlp + bgutil poToken provider có lấy được transcript YouTube từ IP GitHub Actions (datacenter) không.
# Chạy tay: Actions → TEST Transcript (poToken) → Run workflow. KHÔNG đụng gì tới pipeline render.
on:
  workflow_dispatch:
    inputs:
      videoUrl:
        description: "Link YouTube (có phụ đề EN)"
        required: true
        default: "https://youtu.be/aircAruvnKk"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: IP runner (xem có phải datacenter)
        run: echo "Runner IP:" && curl -s https://api.ipify.org && echo ""

      - name: Cài yt-dlp + plugin bgutil poToken
        run: python -m pip install -U yt-dlp bgutil-ytdlp-pot-provider

      - name: BASELINE — thử KHÔNG poToken (provider chưa chạy)
        continue-on-error: true
        run: |
          echo "=== yt-dlp KHÔNG poToken ==="
          yt-dlp --skip-download --write-auto-sub --write-sub --sub-lang "en,en-US" --sub-format vtt -o "no.%(ext)s" "${{ github.event.inputs.videoUrl }}" 2>&1 | grep -iE "subtitle|writing|sign in|error|reload|bot" | tail -12 || true
          if ls no.*.vtt >/dev/null 2>&1; then echo "➡️ BASELINE: CÓ subs (không cần poToken?!)"; else echo "➡️ BASELINE: KHÔNG có subs (đúng như dự đoán datacenter bị chặn)"; fi

      - name: Khởi động bgutil poToken provider (Docker)
        run: |
          docker run --name bgutil -d -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider
          sleep 10
          echo "provider ping:" && (curl -s http://127.0.0.1:4416/ping || echo "không ping được")

      - name: VỚI poToken — thử lấy transcript
        run: |
          echo "=== yt-dlp CÓ poToken (provider chạy nền) ==="
          yt-dlp -v --skip-download --write-auto-sub --write-sub --sub-lang "en,en-US" --sub-format vtt -o "yes.%(ext)s" "${{ github.event.inputs.videoUrl }}" 2>&1 | grep -iE "pot|potoken|GVS|subtitle|writing|sign in|error|reload|bot" | tail -30 || true
          echo "--- file thu được ---"
          if ls yes.*.vtt >/dev/null 2>&1; then
            CHARS=$(grep -vE "^(WEBVTT|Kind|Language|[0-9]|$)|-->" yes.*.vtt | tr -d '\n' | wc -c)
            echo "✅✅ POTOKEN LẤY ĐƯỢC TRANSCRIPT — ~$CHARS ký tự"
            grep -vE "^(WEBVTT|Kind|Language|[0-9]|$)|-->" yes.*.vtt | head -3
          else
            echo "❌ poToken vẫn KHÔNG lấy được (IP GitHub Actions bị chặn cứng)"
          fi
