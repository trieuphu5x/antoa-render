name: ANTOA Trend (săn velocity + phối + chấm)

# CF Worker (Tower) chỉ đạo qua repository_dispatch; runner Mỹ làm việc (Claude không 403 + Supadata transcript + velocity YT/TikTok).
#  - trend-hunt: săn VELOCITY (YouTube 2 bước ≤7 ngày + TikTok Apify) → candidates (KHÔNG Claude, cho nút "Săn tin ngay" xem trước).
#  - trend-auto: săn → chống trùng → top velocity → transcript → PHỐI 1-5' → AI CHẤM (cổng an toàn) → callback tạo content.
# workflow_dispatch = Boss bấm tay TEST (artifact để xem trước khi bật auto). Nhẹ (chỉ node + fetch, KHÔNG ffmpeg/chromium).
on:
  repository_dispatch:
    types: [trend-hunt, trend-auto, trend-phoi]
  workflow_dispatch:
    inputs:
      action:
        description: "hunt / auto"
        type: choice
        options: [hunt, auto]
        default: hunt
      keywords:
        description: "từ khoá, cách nhau dấu phẩy"
        default: "AI Agent, AI thay nhân viên, tự động hoá kinh doanh"
      brandName:
        default: "Agent Thực Chiến"
      niche:
        default: "ứng dụng AI Agent vào kinh doanh sản phẩm số và công việc"
      region:
        default: "vn"

jobs:
  trend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLAUDE_KEY: ${{ secrets.CLAUDE_API_KEY }}
      CLAUDE_MODEL: ${{ secrets.CLAUDE_MODEL }}
      YT_KEY: ${{ secrets.YT_KEY }}
      SUPADATA_KEY: ${{ github.event.client_payload.supadataKey || secrets.SUPADATA_KEY }}   # BYOK: key Supadata KHÁCH (dùng chung Evergreen) → fallback secret
      APIFY_TOKEN: ${{ github.event.client_payload.apifyKey || secrets.APIFY_TOKEN }}         # BYOK: key Apify KHÁCH (TikTok) → fallback secret
      BRAND_NAME: ${{ github.event.client_payload.meta.brandName || github.event.inputs.brandName }}
      NICHE: ${{ github.event.client_payload.meta.niche || github.event.inputs.niche }}
      PERSONA: ${{ github.event.client_payload.meta.persona }}
      SLOGAN: ${{ github.event.client_payload.meta.slogan }}
      REGION: ${{ github.event.client_payload.meta.region || github.event.inputs.region }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      - name: Che KEY KHÁCH (BYOK) khỏi log public
        if: ${{ github.event.client_payload.supadataKey != '' || github.event.client_payload.apifyKey != '' }}
        run: |
          [ -n "${{ github.event.client_payload.supadataKey }}" ] && echo "::add-mask::${{ github.event.client_payload.supadataKey }}" || true
          [ -n "${{ github.event.client_payload.apifyKey }}" ] && echo "::add-mask::${{ github.event.client_payload.apifyKey }}" || true

      - name: Chuẩn hoá ACTION (repository_dispatch → bỏ tiền tố trend-)
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "ACTION=${{ github.event.action }}" | sed 's/trend-//' >> "$GITHUB_ENV"
          else
            echo "ACTION=${{ github.event.inputs.action }}" >> "$GITHUB_ENV"
          fi

      # ===================== SĂN (hunt) =====================
      # KEYWORDS resolve NGAY trong run step (export shell var — chịu được toJSON đa dòng; KHÔNG vòng qua GITHUB_ENV vì đa dòng làm hỏng env file).
      - name: SĂN VELOCITY (hunt)
        if: ${{ env.ACTION == 'hunt' }}
        env:
          PER_KEYWORD: "5"
          LIMIT: ${{ github.event.client_payload.limit || '10' }}
          KW_JSON: ${{ github.event.client_payload.keywords && toJSON(github.event.client_payload.keywords) || '' }}
          KW_CSV: ${{ github.event.inputs.keywords }}
        run: |
          if [ -n "$KW_JSON" ]; then export KEYWORDS="$KW_JSON";
          else export KEYWORDS=$(python3 -c "import json,os;print(json.dumps([s.strip() for s in os.environ.get('KW_CSV','').split(',') if s.strip()]))"); fi
          node trend_hunt.mjs

      - name: Callback SĂN về Tower
        if: ${{ env.ACTION == 'hunt' && github.event_name == 'repository_dispatch' && github.event.client_payload.callback != '' }}
        run: |
          jq -n --slurpfile r candidates.json \
            --arg jobId "${{ github.event.client_payload.jobId }}" \
            --arg brandId "${{ github.event.client_payload.brandId }}" \
            --arg secret "${{ secrets.RENDER_CALLBACK_SECRET }}" \
            '{kind:"trend-hunt", jobId:$jobId, brandId:$brandId, secret:$secret, result:$r[0]}' \
          | curl -sS -X POST "${{ github.event.client_payload.callback }}" -H 'content-type: application/json' -d @-

      # ===================== SẢN XUẤT AUTO =====================
      - name: SĂN + PHỐI + CHẤM (auto)
        if: ${{ env.ACTION == 'auto' }}
        env:
          PER_KEYWORD: "5"
          MIN_SCORE: "7"
          PRODUCED_TITLES: ${{ github.event.client_payload.producedTitles && toJSON(github.event.client_payload.producedTitles) || '[]' }}
          SEEN_URLS: ${{ github.event.client_payload.seenUrls && toJSON(github.event.client_payload.seenUrls) || '[]' }}
          KW_JSON: ${{ github.event.client_payload.keywords && toJSON(github.event.client_payload.keywords) || '' }}
          KW_CSV: ${{ github.event.inputs.keywords }}
        run: |
          if [ -n "$KW_JSON" ]; then export KEYWORDS="$KW_JSON";
          else export KEYWORDS=$(python3 -c "import json,os;print(json.dumps([s.strip() for s in os.environ.get('KW_CSV','').split(',') if s.strip()]))"); fi
          node trend_auto.mjs

      - name: Callback AUTO về Tower
        if: ${{ env.ACTION == 'auto' && github.event_name == 'repository_dispatch' && github.event.client_payload.callback != '' }}
        run: |
          jq -n --slurpfile r trend.json \
            --arg jobId "${{ github.event.client_payload.jobId }}" \
            --arg brandId "${{ github.event.client_payload.brandId }}" \
            --arg workflowId "${{ github.event.client_payload.workflowId }}" \
            --arg secret "${{ secrets.RENDER_CALLBACK_SECRET }}" \
            '{kind:"trend-auto", jobId:$jobId, brandId:$brandId, workflowId:$workflowId, secret:$secret, result:$r[0], script:($r[0].script // ""), hasTranscript:($r[0].hasTranscript // false)}' \
          | curl -sS -X POST "${{ github.event.client_payload.callback }}" -H 'content-type: application/json' -d @-

      # ===================== PHỐI THỦ CÔNG (phoi) =====================
      - name: PHỐI Trend (phoi)
        if: ${{ env.ACTION == 'phoi' }}
        env:
          VIDEO_URL: ${{ github.event.client_payload.videoUrl }}
          PLATFORM: ${{ github.event.client_payload.platform }}
          TITLE: ${{ github.event.client_payload.title }}
        run: node trend_phoi.mjs

      - name: Callback PHỐI về Tower
        if: ${{ env.ACTION == 'phoi' && github.event_name == 'repository_dispatch' && github.event.client_payload.callback != '' }}
        run: |
          jq -n --rawfile script script.txt \
            --arg jobId "${{ github.event.client_payload.jobId }}" \
            --arg sourceId "${{ github.event.client_payload.sourceId }}" \
            --arg secret "${{ secrets.RENDER_CALLBACK_SECRET }}" \
            '{kind:"compose", jobId:$jobId, sourceId:$sourceId, secret:$secret, script:$script}' \
          | curl -sS -X POST "${{ github.event.client_payload.callback }}" -H 'content-type: application/json' -d @-

      - name: Xuất kết quả (test tay)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: trend-out
          path: |
            candidates.json
            trend.json
          if-no-files-found: ignore
          retention-days: 7
